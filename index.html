<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Photo Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="searchPage" class="container">
    <h2>Search Student Photo</h2>

    <input type="text" id="hallticket" placeholder="Enter 12-digit Hall Ticket">
    
    <div class="checkbox">
        <input type="checkbox" id="robotCheck">
        <label for="robotCheck">I am not a robot</label>
    </div>

    <button onclick="showResult()">Search</button>
</div>

<div id="photoPage" class="container" style="display:none;"></div>

<script src="script.js"></script>
</body>
</html>
